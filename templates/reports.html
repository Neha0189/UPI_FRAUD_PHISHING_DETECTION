{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block content %}
<h3 class="mb-4">Reports & Trends</h3>

<div class="row g-4">
  <div class="col-md-6">
    <div class="card p-3">
      <h5>Risk Distribution</h5>
      <canvas id="riskChart"></canvas>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card p-3">
      <h5>High-Risk Transactions Over Time</h5>
      <canvas id="trendChart"></canvas>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
  const riskLabels = {{ risk_labels | tojson }};
  const riskValues = {{ risk_values | tojson }};
  const trendDays = {{ trend_days | tojson }};
  const trendCounts = {{ trend_counts | tojson }};

  new Chart(document.getElementById('riskChart'), {
    type: 'bar',
    data: {
      labels: riskLabels,
      datasets: [{
        label: 'Number of Transactions',
        data: riskValues,
        backgroundColor: ['#4CAF50', '#FFC107', '#F44336']
      }]
    },
    options: { plugins: { legend: { display: false } } }
  });

  new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: {
      labels: trendDays,
      datasets: [{
        label: 'Flagged Count',
        data: trendCounts,
        borderColor: '#F44336',
        tension: 0.2
      }]
    }
  });
</script>
{% endblock %}
